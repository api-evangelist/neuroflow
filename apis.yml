aid: neuroflow
name: NeuroFlow
description: 'NeuroFlow is a Philadelphia-based behavioral health technology company
  that gives payers, health systems, provider groups and federal agencies the infrastructure
  to identify and manage behavioral health risk at scale. Its IntegrateBH platform
  pairs patient-facing mobile and web applications with measurement-based care and
  screening workflows, clinical dashboards, care-coordination tooling and population-level
  behavioral health analytics. The platform reaches customers through EHR and partner
  integrations — including Epic (App Orchard / Epic Showroom) and the Xealth digital-health
  ecosystem — over a session-authenticated REST API served from neuroflowlive.com/api/.
  NeuroFlow publishes no public developer portal: a Swagger document exists at /api/swagger.json
  on every environment, but it returns HTTP 401 "Please log in to continue" to anonymous
  callers, so the contract is customer-only.'
