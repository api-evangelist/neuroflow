apis:
- aid: neuroflow:neuroflow-live-api
  name: NeuroFlow Live API
  description: 'The REST API behind the NeuroFlow Live web and mobile applications,
    served same-origin from https://neuroflowlive.com/api/ (server: gunicorn, versioned
    /api/v2/ routes). A Swagger document is published by the service at /api/swagger.json
    but is session-gated: anonymous requests return HTTP 401 with the JSON envelope
    {"message": "Please log in to continue", "code": 0}. The same route and the same
    401 were observed on the sandbox, QA, staging and dev environments, so no public
    machine-readable contract is reachable.'
  humanURL: https://www.neuroflow.com/integratebh/
  baseURL: https://neuroflowlive.com/api/
  tags:
  - Behavioral Health
  - Health Care
  - Mental Health
  x-evidence:
    fetched: '2026-08-04'
    probes:
    - url: https://neuroflowlive.com/api/swagger.json
      http_status: 401
      content_type: application/json
      note: real backend route (server gunicorn); auth-gated Swagger document
    - url: https://sandbox.neuroflow.io/api/swagger.json
      http_status: 401
      content_type: application/json
    - url: https://stg.neuroflow.io/api/swagger.json
      http_status: 401
      content_type: application/json
    - url: https://neuroflowlive.com/openapi.json
      http_status: 200
      content_type: text/html
      note: single-page-app catch-all, not a spec
  properties: []
